\* Derived from the external vanlightly-raft FlexibleRaft.cfg.
\* Five servers, one value, one election and at most sixteen message records.
\* The domain-size bound is invariant under server permutations and keeps
\* a complete TLC single-worker oracle affordable; retains SYMMETRY and VIEW.
\* Use FlexibleRaftReduced5.tla (EXTENDS the upstream FlexibleRaft module).
\* SPECIFICATION
\* Uncomment the previous line and provide the specification name if it's declared
\* in the specification file. Comment INIT / NEXT parameters if you use SPECIFICATION.

\* State space is huge for this one - run with simulation.

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    n4 = n4
    n5 = n5
    v1 = v1
    v2 = v2
    Server = { n1, n2, n3, n4, n5}
    ElectionQuorumSize = 3
    ReplicationQuorumSize = 4
    Value = { v1 }
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    EqualTerm = EqualTerm
    LessOrEqualTerm = LessOrEqualTerm
    MaxElections = 1
    MaxRestarts = 0

INIT Init
NEXT Next
CONSTRAINT MessageBound

VIEW view
SYMMETRY symmServers

\* Uncomment when using multiple values
\* SYMMETRY symmValues

\* PROPERTY
\* Uncomment the previous line and add property names

INVARIANT
LeaderHasAllAckedValues
NoLogDivergence
