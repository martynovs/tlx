\* Reduced from the external vanlightly-raft PullRaft.cfg: three servers, one value,
\* one election, no restarts, deadlock checking off (bounded terminal states).
\* Message bags keyed by records with sequence fields: the value store
\* workload (docs/value-store.md).
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    v1 = v1
    Server = { n1, n2, n3}
    Value = { v1 }
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    PullEntriesRequest = PullEntriesRequest
    PullEntriesResponse = PullEntriesResponse
    LeaderNotifyRequest = LeaderNotifyRequest
    EqualTerm = EqualTerm
    LessOrEqualTerm = LessOrEqualTerm
    MaxElections = 1
    MaxRestarts = 0
INIT Init
NEXT Next
VIEW view
SYMMETRY symmServers
INVARIANT
LeaderHasAllAckedValues
NoLogDivergence
CHECK_DEADLOCK FALSE
