\* FiniteMonotonic/MCReplicatedLog with four nodes and three transactions:
\* WriteFairSpec assumes <>[][WriteTx(n, tx)]_vars for each of the 12
\* pairs, so the negation of Convergence is a conjunction of 13 <>[]
\* obligations (2^13 tableau states as one formula). 35K states.
SPECIFICATION
    WriteFairSpec
CONSTANTS
  Node = {n1, n2, n3, n4}
  Transaction = {tx1, tx2, tx3}
  Next <- ReductionNext
INVARIANTS
    TypeOK
    Safety
PROPERTIES
    Convergence
CONSTRAINT
    Constraint
