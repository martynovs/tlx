\* MongoDB's MCRaftMongo (corpus ext/mongo/MCRaftMongo) with four election
\* terms instead of three: 1.57M states, 15M edges, nine leads-to
\* properties under strong fairness. A liveness scaling case. Without the
\* two NeverRollback invariants, which four terms violate (SERVER-39626).
CONSTANT MaxClientWriteSize = 2
CONSTANT MaxTerm = 4
CONSTANT MaxLogLen = 3
CONSTANT Server = {1, 2, 3}
INVARIANT NoTwoPrimariesInSameTerm
PROPERTY CommitPointEventuallyPropagates
CONSTRAINT StateConstraint
SPECIFICATION Spec
