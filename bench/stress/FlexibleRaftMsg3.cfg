\* Reduced from the external vanlightly-raft FlexibleRaft.cfg: three servers, one value,
\* one election, no restarts, deadlock checking off (bounded terminal states).
\* Message bags keyed by records with sequence fields: the value store
\* workload (docs/value-store.md).
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    n4 = n4
    n5 = n5
    v1 = v1
    v2 = v2
    Server = { n1, n2, n3}
    ElectionQuorumSize = 2
    ReplicationQuorumSize = 2
    Value = { v1 }
    Follower = Follower
    Candidate = Candidate
    Leader = Leader
    Nil = Nil
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    AppendEntriesRequest = AppendEntriesRequest
    AppendEntriesResponse = AppendEntriesResponse
    EqualTerm = EqualTerm
    LessOrEqualTerm = LessOrEqualTerm
    MaxElections = 1
    MaxRestarts = 0
INIT Init
NEXT Next
VIEW view
SYMMETRY symmServers
INVARIANT
LeaderHasAllAckedValues
NoLogDivergence
CHECK_DEADLOCK FALSE
