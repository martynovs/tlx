name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CC: clang
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  quality:
    name: Quality and Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: cargo-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Test dependencies
        run: |
          python3 -m pip install -r .github/requirements-ci.txt
          echo "TLX_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
          bash scripts/fetch-deps.sh --tests-only
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --release --all-targets --locked -- -D warnings
      - name: Build binary for Python tests and documentation examples
        run: cargo build --profile test-release --locked
      - name: Python driver tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Public source and documentation checks
        run: |
          python3 scripts/check_imports.py
          python3 scripts/knobs_check.py
          python3 scripts/doccheck.py --require-examples
          python3 scripts/bench.py report --check

  test:
    name: Rust and specs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            jobs: 3
          - os: ubuntu-24.04-arm
            jobs: 3
          - os: macos-15
            jobs: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      RUST_TEST_THREADS: ${{ matrix.jobs }}
      TLX_TLC_XMX: 2g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: cargo-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Test dependencies
        run: |
          echo "TLX_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
          bash scripts/fetch-deps.sh
          mkdir -p target/ci
      - name: Rust unit and integration tests
        run: cargo test --workspace --profile test-release --locked --no-fail-fast
      - name: Build checker for conformance tests
        run: cargo build --profile test-release --locked
      - name: Interpreter conformance
        run: python3 scripts/spectest.py --no-build --profile test-release --extra=-interp --results-json target/ci/interpreter.json
      - name: Compiled conformance
        run: python3 scripts/spectest.py --no-build --profile test-release --extra=-compile --results-json target/ci/compiled.json
      - name: Paranoid compiled conformance
        env:
          TLX_PARANOID: "1"
        run: python3 scripts/spectest.py --no-build --profile test-release --extra=-compile --results-json target/ci/paranoid.json
      - name: Retain conformance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-${{ matrix.os }}
          path: target/ci/
          if-no-files-found: ignore
          retention-days: 14

  ci:
    name: CI
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
