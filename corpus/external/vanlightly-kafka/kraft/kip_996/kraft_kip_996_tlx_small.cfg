\* tlx corpus: kraft_kip_996.cfg with smaller bounds (4 hosts, 1 value, epoch 2, one add and one
\* remove reconfiguration, no crashes, restarts, connectivity changes or disruptive elections).
\* This is a safety model: TestLiveness = FALSE and SPECIFICATION Spec (no fairness), as in
\* kip_853.  Upstream's liveness form (TestLiveness = TRUE, LivenessSpec) has an infinite
\* state space - elections can end in a draw forever - so it has no finite BFS oracle and
\* can only be simulated; see the model README, 'Safety and liveness'.

CONSTANTS
    h1 = h1
    h2 = h2
    h3 = h3
    h4 = h4
    v1 = v1

    \* model parameters
    TestLiveness = FALSE
    MaxEpoch = 2
    MaxRestarts = 0
    MaxPermCrashes = 0
    MaxValuesPerEpoch = 1
    MaxAddReconfigs = 1
    MaxRemoveReconfigs = 1
    MaxConnectivityChanges = 0
    MaxDisruptiveElectionTriggers = 0
    MaxSpawnedServers = 4
    InitClusterSize = 3
    MinClusterSize = 3
    MaxClusterSize = 4
    Value = { v1 }
    Hosts = { h1, h2, h3, h4 }

    \* model values
    Voter = Voter
    Observer = Observer
    Follower = Follower
    Candidate = Candidate
    Prospective = Prospective
    Leader = Leader
    Unattached = Unattached
    Voted = Voted
    Resigned = Resigned
    DeadNoState = DeadNoState
    Nil = Nil
    AppendCommand = AppendCommand
    InitClusterCommand = InitClusterCommand
    AddVoterCommand = AddVoterCommand
    RemoveVoterCommand = RemoveVoterCommand
    LeaderChangeRecord = LeaderChangeRecord
    RequestVoteRequest = RequestVoteRequest
    RequestVoteResponse = RequestVoteResponse
    BeginQuorumEpochRequest = BeginQuorumEpochRequest
    FetchRequest = FetchRequest
    FetchResponse = FetchResponse
    Ok = Ok
    NotOk = NotOk
    Diverging = Diverging
    FencedLeaderEpoch = FencedLeaderEpoch
    NotLeader = NotLeader
    UnknownLeader = UnknownLeader
    UnknownMember = UnknownMember
    AlreadyMember = AlreadyMember
    ReconfigInProgress = ReconfigInProgress
    LeaderNotReady = LeaderNotReady
    InvalidRequest = InvalidRequest
    IllegalState = IllegalState
    EqualEpoch = EqualEpoch
    AnyEpoch = AnyEpoch

SPECIFICATION Spec

INVARIANT
LogMatching
LeaderCompleteness
ElectionSafety
Durability
NoIllegalState
ValidRolesAndStates
