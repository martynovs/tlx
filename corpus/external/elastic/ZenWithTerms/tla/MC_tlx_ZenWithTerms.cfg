\* tlx corpus: see MC_tlx_ZenWithTerms.tla
CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    v1 = v1
    v2 = v2
    Join = Join
    Nodes = {n1, n2, n3}
    Commit = Commit
    PublishResponse = PublishResponse
    Values = {v1, v2}
    PublishRequest = PublishRequest
    Terms <- tlx_def_Terms
    Versions <- tlx_def_Versions
    InitialVersions <- tlx_def_InitialVersions
INIT Init
NEXT Next
CONSTRAINT tlx_constraint
INVARIANT OneMasterPerTerm
INVARIANT LogMatching
INVARIANT SingleNodeInvariant
INVARIANT CommittedValuesDescendantsFromCommittedValues
INVARIANT CommittedValuesDescendantsFromInitialValue
INVARIANT DescendantRelationIsStrictlyOrdered
INVARIANT NewerOpsBasedOnOlderCommittedOps
INVARIANT CommitHasQuorumVsPreviousCommittedConfiguration
INVARIANT P2bInvariant
INVARIANT DescendantRelationIsTransitive
SYMMETRY tlx_symmetry
